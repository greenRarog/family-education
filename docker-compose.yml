services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: "${WWWUSER}"
        WWWGROUP: "${WWWGROUP}"
    container_name: family-education-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER}:${WWWGROUP}"
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - family-education

  nginx:
    image: nginx:1.29-alpine
    container_name: family-education-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - family-education

  postgres:
    image: postgres:17-alpine
    container_name: family-education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_education
      POSTGRES_USER: family_education
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_education -d family_education"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - family-education

  redis:
    image: redis:8-alpine
    container_name: family-education-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - family-education

networks:
  family-education:

volumes:
  postgres_data:
  redis_data:
