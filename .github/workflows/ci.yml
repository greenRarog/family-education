name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # Artisan migration/setup commands do not read PHPUnit XML settings.
    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: family_education_test
      DB_USERNAME: family_education
      DB_PASSWORD: secret
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: family_education_test
          POSTGRES_USER: family_education
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U family_education -d family_education_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, redis
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan config:clear
          php artisan key:generate

      - name: Style and static analysis
        run: |
          composer lint
          composer analyse

      - name: Test with SQLite
        run: composer test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_URL: ""

      - name: Configure PostgreSQL test database
        run: |
          php artisan config:clear
          php artisan migrate --database=pgsql --force --no-interaction

      - name: Test with PostgreSQL
        run: |
          php artisan config:clear
          php artisan test --configuration=phpunit.pgsql.xml
