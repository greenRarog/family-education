services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        WWWUSER: "${WWWUSER}"
        WWWGROUP: "${WWWGROUP}"
    container_name: family-education-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER}:${WWWGROUP}"
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - family-education

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: family-education-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - family-education

  postgres:
    image: postgres:17-alpine
    container_name: family-education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_education
      POSTGRES_USER: family_education
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U family_education -d family_education"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - family-education

  redis:
    image: redis:8-alpine
    container_name: family-education-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - family-education

networks:
  family-education:

volumes:
  postgres_data:
  redis_data:
